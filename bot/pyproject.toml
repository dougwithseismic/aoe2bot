[project]
name = "aoe2bot"
version = "0.2.0"
description = "Claude-controlled AoE2:DE bot via AoE2Control"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pipe = [
    "pywin32>=306",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pywin32>=306",
]

[project.scripts]
aoe2bot = "aoe2bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aoe2bot"]

[tool.ruff]
target-version = "py311"
line-length = 120
